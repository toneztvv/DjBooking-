services:
  - type: web
    name: djxpress
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: SITE_URL
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AUDD_API_KEY
        sync: false
